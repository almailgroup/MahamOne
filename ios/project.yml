# The Maham One iPhone and iPad app. XcodeGen makes the Xcode project from
# this file (`brew install xcodegen`, then `xcodegen` in this folder); the
# project itself is not kept in git. See ios/README.md.
name: MahamOne

options:
  bundleIdPrefix: com.almailgroup
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic

packages:
  MahamKit:
    path: MahamKit

targets:
  MahamOne:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - PrivacyInfo.xcprivacy
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared
    dependencies:
      - package: MahamKit
      - target: MahamWidgets
        embed: true
    entitlements:
      path: App/MahamOne.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(KEYCHAIN_GROUP)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Maham One
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar]
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.business
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.almailgroup.mahamone
            CFBundleURLSchemes: [mahamone]
        NSUserActivityTypes:
          - com.almailgroup.mahamone.task
          - com.almailgroup.mahamone.invoice
          - com.almailgroup.mahamone.client
        BGTaskSchedulerPermittedIdentifiers:
          - com.almailgroup.mahamone.refresh
        UIBackgroundModes: [fetch]
        NSSupportsLiveActivities: true
        NSFaceIDUsageDescription: Maham One uses Face ID to keep your company's data locked when you're away.
        NSCalendarsWriteOnlyAccessUsageDescription: Maham One adds a task's due date to your calendar when you ask it to.
        NSContactsUsageDescription: Maham One saves a client's phone and email to your contacts when you ask it to.
        SupabaseURL: https://$(SUPABASE_HOST)
        SupabasePublishableKey: $(SUPABASE_PUBLISHABLE_KEY)
        KeychainGroup: $(KEYCHAIN_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: MahamOne
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  MahamWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    dependencies:
      - package: MahamKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widgets/MahamWidgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(KEYCHAIN_GROUP)
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Maham One
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        SupabaseURL: https://$(SUPABASE_HOST)
        SupabasePublishableKey: $(SUPABASE_PUBLISHABLE_KEY)
        KeychainGroup: $(KEYCHAIN_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
        PRODUCT_NAME: MahamWidgets
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

schemes:
  MahamOne:
    build:
      targets:
        MahamOne: all
        MahamWidgets: all
    run:
      config: Debug
    archive:
      config: Release
