# The Maham One AI proxy: a Cloudflare Worker between the app and Google's
# Gemini API. README.md (next to this file) is the step-by-step deploy guide.
#
# The Gemini key is NOT in this file and must never be. It is an encrypted
# secret, set once with:
#   npx wrangler secret put GEMINI_API_KEY
# (or in the dashboard: the Worker -> Settings -> Variables and Secrets ->
# Add -> type "Secret"). Everything below is safe to keep in git.

name = "maham-ai-proxy"
main = "src/worker.js"
compatibility_date = "2026-10-01"
# Lets the Worker notice when the app closes the connection (request.signal),
# so it stops waiting for Google too.
compatibility_flags = ["enable_request_signal"]

# The address https://maham-ai-proxy.<your-subdomain>.workers.dev.
workers_dev = true
# No extra per-version preview addresses.
preview_urls = false

# Optional: serve the Worker at https://ai.mahamone.com instead of (or as well
# as) the workers.dev address. This works ONLY if mahamone.com's DNS is managed
# by Cloudflare (the domain is a zone in this Cloudflare account). The app
# itself is hosted on Vercel, so check where the domain's DNS lives first.
# This line must stay above [vars] when it is turned on.
# routes = [{ pattern = "ai.mahamone.com", custom_domain = true }]

[vars]
# The model used when the app names none. Model names change often: when
# Google retires this one, change it here (and in ALLOWED_MODELS).
GEMINI_MODEL = "gemini-3.6-flash"
# The only models the app may ask for (comma-separated). Anything else is
# refused with model_not_allowed.
ALLOWED_MODELS = "gemini-3.6-flash"
# The web pages allowed to call the Worker from a browser (comma-separated,
# exact, no "*"). www.mahamone.com redirects to the apex, so it isn't needed.
ALLOWED_ORIGINS = "https://mahamone.com"
# The Supabase project the app signs people in with (src/cloud/config.ts).
# The publishable key is public by design: it only names the project.
SUPABASE_URL = "https://gagdyhintrxdkiqhahzh.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_KyVAkWtemw_XDnNK8ZKRpA_-5x4pk8d"
# Optional. Empty: everyone signed in to Maham One may use the AI. Anyone can
# create an account in the app, so Google bills the owner for whoever uses it.
# To allow only the members of your own companies, put one company's cloud id
# here, or several separated by commas (README step 2.0 shows how to find them).
COMPANY_ID = ""
# The longest answer, in tokens (Gemini counts its thinking in this too).
MAX_OUTPUT_TOKENS = "8192"
# The longest answer when a request doesn't say (no maxOutputTokens), never
# above MAX_OUTPUT_TOKENS. A request that sets no thinking gets low thinking.
DEFAULT_ANSWER_TOKENS = "2048"
# The largest request the Worker accepts, in bytes (256 KB).
MAX_BODY_BYTES = "262144"
# Optional timeouts, in milliseconds (these are the defaults):
# GENERATE_TIMEOUT_MS = "90000"     # /v1/generate: the whole answer
# STREAM_START_TIMEOUT_MS = "30000" # /v1/stream: until the first byte
# STREAM_IDLE_TIMEOUT_MS = "60000"  # /v1/stream: the longest pause

# Per-user limit: 30 requests a minute for each signed-in person. Counted in
# each Cloudflare location separately, so it is a guard against runaway loops,
# not an exact quota. namespace_id is any positive whole number not used by
# another rate limiter in this Cloudflare account.
[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[observability]
enabled = true

[observability.logs]
# Keep only the Worker's own log lines (metadata, no prompts or tokens), not
# Cloudflare's automatic per-request records.
invocation_logs = false

# A second Worker, maham-ai-proxy-dev, for trying the app on this computer
# (npm run dev in the app, http://localhost:5173). Deploy it with
#   npx wrangler deploy --env dev
# and give it its own key with
#   npx wrangler secret put GEMINI_API_KEY --env dev
# Settings below [env.dev] don't inherit from above, so they are repeated.
[env.dev]
workers_dev = true

[env.dev.vars]
GEMINI_MODEL = "gemini-3.6-flash"
ALLOWED_MODELS = "gemini-3.6-flash"
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"
SUPABASE_URL = "https://gagdyhintrxdkiqhahzh.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_KyVAkWtemw_XDnNK8ZKRpA_-5x4pk8d"
# Optional, as above. Empty: everyone signed in may use the dev Worker. Set it
# to a test company's id (or several, separated by commas) to allow only their
# members.
COMPANY_ID = ""
MAX_OUTPUT_TOKENS = "8192"
DEFAULT_ANSWER_TOKENS = "2048"
MAX_BODY_BYTES = "262144"

[[env.dev.ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }
